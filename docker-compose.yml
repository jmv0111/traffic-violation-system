# Real-time NCAP Analytics: Kafka (ingestion) -> Spark (transformation) -> Cassandra (persistence)
#
#   docker compose up --build
#
# Host ports: dashboard localhost:8000, Kafka localhost:9092, Cassandra localhost:9042, Spark UI localhost:4040

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: ncap-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ncap-traffic-telemetry --partitions 3 --replication-factor 1
    restart: "no"

  cassandra:
    image: cassandra:4.1
    container_name: ncap-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ncap-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra:/schema:ro
    entrypoint: ["cqlsh", "cassandra", "9042", "-f", "/schema/schema.cql"]
    restart: "no"

  spark-processor:
    image: spark:3.5.3-scala2.12-java17-python3-ubuntu
    container_name: ncap-spark
    user: root
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "4040:4040"
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CASSANDRA_HOST: cassandra
      SPARK_CHECKPOINT_DIR: /checkpoints
    volumes:
      - ./:/app:ro
      - spark-checkpoints:/checkpoints
      - spark-ivy:/tmp/.ivy2
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,com.datastax.spark:spark-cassandra-connector_2.12:3.5.1
      - /app/ncap/stream_processor.py
    restart: on-failure

  producer:
    build: .
    container_name: ncap-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CASSANDRA_HOST: cassandra
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "ncap.producer", "--loop"]
    restart: on-failure

  api:
    build: .
    container_name: ncap-api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CASSANDRA_HOST: cassandra
      SPARK_UI_URL: http://spark-processor:4040
    volumes:
      - ./web:/app/web:ro
    command: ["uvicorn", "ncap.api:app", "--host", "0.0.0.0", "--port", "8000",
              "--timeout-graceful-shutdown", "3"]
    restart: on-failure

volumes:
  cassandra-data:
  spark-checkpoints:
  spark-ivy:
